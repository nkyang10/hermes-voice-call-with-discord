[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-voice-call-with-discord"
version = "1.0.0"
description = "Bidirectional Discord voice bot — listen via Qwen3-ASR → respond via Hermes AI Agent → speak via edge-tts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]
keywords = ["discord", "voice", "asr", "tts", "hermes", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/nkyang10/hermes-voice-call-with-discord"
Repository = "https://github.com/nkyang10/hermes-voice-call-with-discord"
BugTracker = "https://github.com/nkyang10/hermes-voice-call-with-discord/issues"

[project.scripts]
hermes-voice-bot = "discord_voice_bot_v4:main"
